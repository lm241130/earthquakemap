<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日本の地震データポータル</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 40px auto; padding: 0 20px; background-color: #f4f7f6; }
        .hero { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .btn-container { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.3s; }

    </style>
</head>
<body>

    <div class="hero">
        <h1>日本の地震について</h1>
        <p>日本は世界でも有数の地震大国です。プレートの境界に位置しているため、日常的に小さな地震が発生し、時に大きな被害をもたらします。気象庁では、これらの地震活動を観測し、震度データとして記録・公開しています。</p>
        <p>このサイトでは、気象庁の確定値に基づいた都道府県別の震度観測回数を可視化し、地震活動の推移を直感的に理解できるようにまとめています。</p>

        </div>
