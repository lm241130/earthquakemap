        var selectedShindo = document.getElementById('shindo_select').value;

        var data = new google.visualization.DataTable();
        data.addColumn('string', '都道府県');
        data.addColumn('number', '地震回数');
        data.addRows(rows);

        var maxCount = 50;
        if (selectedShindo === 'shindo1') maxCount = 35;
        if (selectedShindo === 'shindo2') maxCount = 12;
        if (selectedShindo === 'shindo3') maxCount = 3;
        if (selectedShindo === 'shindo4_above') maxCount = 2;

        var options = {
          region: 'JP',
          resolution: 'provinces',
          colorAxis: {
            values: [0, Math.round(maxCount*0.01), Math.round(maxCount*0.04), Math.round(maxCount*0.1), maxCount], 
            colors: ['#fff7ec', '#fdbb84', '#fc8d59', '#ef6548', '#7f0000']
          },
          backgroundColor: '#ffffff',
          datalessRegionColor: '#f5f5f5'
        };

        var chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
        chart.draw(data, options);
      }
